<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>热身赛 · 知识闯关</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">

  <!-- ================= 上方 2/3：动画区 ================= -->
  <div id="sceneWrap">
    <canvas id="scene" width="1920" height="720"></canvas>
    <div id="hud">
      <div id="hudTime">00:00</div>
      <div class="hudBtns">
        <button id="btnSound" class="hudBtn" title="音效开关">🔊</button>
        <button id="btnPause" class="hudBtn" title="暂停/继续">⏸</button>
        <button id="btnFinish" class="hudBtn">提前结算</button>
        <button id="btnHome" class="hudBtn">重开</button>
      </div>
    </div>
    <div id="countdown"></div>
  </div>

  <!-- ================= 下方 1/3：四人操作区 ================= -->
  <div id="panels"></div>

  <!-- ================= 覆盖层：设置 / 结算 ================= -->
  <div id="overlay">

    <div id="setup" class="card">
      <h1>热身赛</h1>
      <p class="sub">四科混合题 · 团队闯关 · 通关赢魔力</p>

      <div class="setRow">
        <div class="setLabel">场景角色</div>
        <div class="opts" id="optTheme"></div>
      </div>

      <div class="setRow" id="rowBuns">
        <div class="setLabel" id="lbBun">题目数量</div>
        <div class="opts" id="optBuns"></div>
        <div class="fixedVal gone" id="bunsFixed">平均<b>15</b> 题 / 人　四人共 <b>60</b> 题　限时 <b>100</b> 秒
          <span class="fxsub">数学 + 语文 + 英语 + 安全 混合题 · 100 秒内答完才通关</span>
        </div>
      </div>

      <div class="setRow">
        <div class="setLabel">选手名字</div>
        <div class="nameInputs">
          <div class="nameCell"><input class="nameIn" id="nm0" maxlength="6"></div>
          <div class="nameCell"><input class="nameIn" id="nm1" maxlength="6"></div>
          <div class="nameCell"><input class="nameIn" id="nm2" maxlength="6"></div>
          <div class="nameCell"><input class="nameIn" id="nm3" maxlength="6"></div>
        </div>
      </div>

      <button id="btnStart" class="bigBtn">开 始 比 赛</button>
      <div class="tip">提示：答错不扣魔力，但会换新题并浪费时间 —— 抢答要准！通关奖励 30 魔力，失败不得魔力。</div>
    </div>

    <div id="result" class="card hidden">
      <h1 id="resultTitle">比赛结束</h1>
      <div id="podium"></div>
      <div id="rankList"></div>
      <div id="energyBox" class="energyBox"></div>
      <button id="btnBoss" class="bigBtn bossBtn">挑 战 第 一 关 →</button>
      <div class="resBtns">
        <button id="btnAgain" class="bigBtn">再 来 一 局</button>
        <button id="btnBack" class="bigBtn ghost">返 回 设 置</button>
      </div>
    </div>

  </div>

  <!-- ============ 团队闯关：100 秒没打死魔王（黑屏） ============ -->
  <div id="timeout">
    <div class="toInner">
      <div class="toKicker">时 间 到</div>
      <div class="toTitle">闯 关 失 败</div>
      <div class="toSub">100 秒内没能完成闯关……换一组同学上台，重新来过吧！</div>
      <button id="btnRetry" class="bigBtn toBtn">重 来 一 次</button>
    </div>
  </div>

  <!-- ============ 团队闯关：100 秒内完成（黑屏 · 赢魔力进第一关） ============ -->
  <div id="victory">
    <div class="vicInner">
      <div class="vicKicker">胜 利</div>
      <div class="vicTitle">热 身 赛 通 关</div>
      <div class="vicFlavor">
        最后一题落下的那一刻，全场欢呼！<br>
        60 道题、四个人、一条心 —— 你们做到了！
      </div>
      <div class="vicStats" id="vicStats"></div>
      <div class="vicEnergy" id="vicEnergy"></div>
      <button id="btnVicGo" class="bigBtn vicBtn">挑 战 第 一 关 · 魔法师大战魔王 →</button>
      <div class="vicTip">用赢到的魔力换一张门票，第一关的魔王正等着你们。</div>
    </div>
  </div>

</div>

<script src="js/questions.js"></script>
<script src="js/banks.js"></script>
<script src="js/scene.js"></script>
<script src="js/game.js"></script>
</body>
</html>
